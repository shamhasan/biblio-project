name: book_inventory_apps
description: "Aplikasi Manajemen Buku Mandiri (Android MVP)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  mobile_scanner: ^6.0.6
  shared_preferences: ^2.5.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true


flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 26 
  adaptive_icon_background: "#FFF1EAE0" 
  adaptive_icon_foreground: "assets/icon/app_icon.png"